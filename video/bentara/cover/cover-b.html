<!doctype html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<title>TikTok Cover</title>
<style>
  /* Matches the account's existing TikTok cover style: outlined caps lines, yellow script title,
     black caption box with cyan/red offset. Text sits inside the centre 3:4 area the profile grid shows. */
  @font-face { font-family: "Script"; src: url("../assets/fonts/kaushan-script-latin-400-normal.woff2"); }
  @font-face { font-family: "Mont"; src: url("../assets/fonts/montserrat-latin-900-normal.woff2"); font-weight: 900; }
  @font-face { font-family: "Mont"; src: url("../assets/fonts/montserrat-latin-800-normal.woff2"); font-weight: 800; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #8fa9c4; }
  .bg { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; object-position: 50% 50%; transform: scale(1.08); transform-origin: 55% 52%; }
  .shade { position: absolute; left: 0; right: 0; top: 0; height: 900px; background: linear-gradient(rgba(70,110,160,.35), rgba(70,110,160,0)); }
  .top { position: absolute; left: 0; right: 0; top: 262px; text-align: center; color: #fff; font-family: "Mont"; font-weight: 900; text-transform: uppercase; }
  .l1 { font-size: 44px; letter-spacing: -.5px; -webkit-text-stroke: 9px #000; paint-order: stroke fill; }
  .l2 { font-size: 40px; letter-spacing: -.5px; margin-top: 4px; -webkit-text-stroke: 9px #000; paint-order: stroke fill; }
  .title { margin-top: -6px; font-family: "Script"; font-size: 168px; line-height: 1.12; color: #ffd21f; text-transform: none; letter-spacing: 0;
           -webkit-text-stroke: 16px #000; paint-order: stroke fill; text-shadow: 0 8px 0 #000, 0 12px 18px rgba(0,0,0,.35); }
  .at { margin-top: -18px; font-size: 26px; letter-spacing: .5px; -webkit-text-stroke: 6px #000; paint-order: stroke fill; }
  .tag { position: absolute; top: 1150px; padding: 12px 26px; border-radius: 14px; background: #fff; color: #000; font-family: "Mont"; font-weight: 900; font-size: 38px; border: 5px solid #000; }
  .box { position: absolute; left: 172px; top: 1318px; }
  .box .cy, .box .rd { position: absolute; inset: 0; }
  .box .cy { background: #25f4ee; transform: translate(-16px, -16px); }
  .box .rd { background: #fe2c55; transform: translate(16px, 16px); }
  .box .bk { position: relative; background: #000; color: #fff; font-family: "Mont"; font-weight: 800; font-size: 60px; line-height: 1.32; padding: 34px 54px 34px 44px; white-space: nowrap; }
</style>
</head>
<body>
  <img class="bg" src="../assets/img/real-corner.jpg" alt="" style="transform:scale(1.25);transform-origin:62% 52%" />
  <div style="position:absolute;left:0;top:0;width:540px;height:1920px;overflow:hidden"><img src="../assets/img/render-corner.jpg" style="position:absolute;left:-60px;top:330px;height:1420px;width:auto" alt="" /><div style="position:absolute;left:0;right:0;top:0;height:340px;background:linear-gradient(#5f8fd0,#7aa6dc)"></div><div style="position:absolute;left:0;right:0;top:1740px;bottom:0;background:#3d6b2a"></div></div>
  <div style="position:absolute;left:536px;top:0;width:8px;height:1920px;background:#fff;box-shadow:0 0 30px rgba(0,0,0,.4)"></div>
  <div class="tag" style="left:60px">RENDER 3D</div><div class="tag" style="right:60px;background:#ffd21f">REALITI</div>
  <div class="shade"></div>
  <div class="top">
    <div class="l1">Render vs Realiti | Bawah 500K</div>
    <div class="l2">Rumah berkembar 1-tingkat</div>
    <div class="title">Jalan Pipit</div>
    <div class="at">@Telok Panglima Garang</div>
  </div>
  <div class="box"><div class="cy"></div><div class="rd"></div><div class="bk">Sama Tak?<br />@ TPG</div></div>
</body>
</html>
